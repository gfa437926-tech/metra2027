name: Flutter Client CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/metra_mobile/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/metra_mobile/**"
      - ".github/workflows/client-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/metra_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test --concurrency=1
