name: Client CI

on:
  push:
    branches: [main, 'implementation/**', 'feat/**', 'fix/**', 'test/**']
    paths:
      - "angular-app/**"
      - "mobile/metra_mobile/**"
      - "backend/**"
      - ".github/workflows/client-ci.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/flutter-web-release.yml"
  pull_request:
    branches: [main, 'implementation/**']
    paths:
      - "angular-app/**"
      - "mobile/metra_mobile/**"
      - ".github/workflows/client-ci.yml"
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/flutter-web-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    name: Angular build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular-app/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/metra_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  flutter_web_release:
    name: Flutter web release build
    needs: flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/metra_mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: metra-flutter-web-and-lockfile
          path: |
            mobile/metra_mobile/build/web
            mobile/metra_mobile/pubspec.lock
