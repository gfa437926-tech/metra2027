name: Client CI

on:
  push:
    branches: [main, work/flutter-canonical-consolidation]
    paths:
      - "angular-app/**"
      - "flutter-app/**"
      - "mobile/metra_mobile/**"
      - ".github/workflows/client-ci.yml"
      - ".github/workflows/deploy-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "angular-app/**"
      - "flutter-app/**"
      - "mobile/metra_mobile/**"
      - ".github/workflows/client-ci.yml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  angular:
    name: Angular build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: angular-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular-app/package.json
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install Chromium for offline browser tests
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run real Chromium PWA and IndexedDB smoke test three times
        shell: bash
        run: |
          failures=0
          for attempt in 1 2 3; do
            echo "Offline Chromium PWA test run ${attempt}/3"
            if npm run test:browser; then
              echo "Offline Chromium PWA test run ${attempt}/3: PASS"
            else
              status=$?
              echo "Offline Chromium PWA test run ${attempt}/3: FAIL (exit ${status})"
              failures=1
            fi
          done
          if [ "$failures" -ne 0 ]; then
            echo "One or more Chromium runs failed; see individual run output above."
            exit 1
          fi

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
