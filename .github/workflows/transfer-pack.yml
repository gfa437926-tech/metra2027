name: Database transfer pack checks

on:
  push:
    paths:
      - "database/transfer/**"
      - ".github/workflows/transfer-pack.yml"
  pull_request:
    paths:
      - "database/transfer/**"
      - ".github/workflows/transfer-pack.yml"

jobs:
  transfer-pack:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n database/transfer/scripts/*.sh
          bash -n database/transfer/scripts/lib/*.sh
          bash -n database/transfer/tests/*.sh
      - name: Test project URL identity
        run: bash database/transfer/tests/test_url_guard.sh
      - name: Test schema dump normalization
        run: bash database/transfer/tests/test_public_schema_normalizer.sh
      - name: Test transfer manifest provenance
        run: bash database/transfer/tests/test_manifest.sh
      - name: Test excluded observation data dump guard
        run: bash database/transfer/tests/test_data_policy.sh
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Exercise real pg_dump schema and data filters
        run: |
          createdb dump_fixture
          psql -X -v ON_ERROR_STOP=1 -d dump_fixture -c "CREATE SCHEMA private; CREATE TABLE public.fixture_public(id integer); CREATE TABLE private.fixture_private(id integer); CREATE TABLE public.excluded_fixture(id integer); INSERT INTO public.fixture_public VALUES (1); INSERT INTO public.excluded_fixture VALUES (99);"
          pg_dump --schema-only --schema=public --schema=private --no-owner --no-privileges -d dump_fixture > /tmp/actual_schema_dump.sql
          source database/transfer/scripts/lib/project_url_guard.sh
          metra_normalize_public_schema_dump /tmp/actual_schema_dump.sql /tmp/normalized_schema_dump.sql
          if grep -Fq "CREATE SCHEMA public;" /tmp/normalized_schema_dump.sql || grep -Fq "CREATE SCHEMA private;" /tmp/normalized_schema_dump.sql; then
            echo "Normalized pg_dump still attempts to create an existing schema."
            exit 1
          fi
          grep -F "CREATE TABLE public.fixture_public" /tmp/normalized_schema_dump.sql
          grep -F "CREATE TABLE private.fixture_private" /tmp/normalized_schema_dump.sql
          pg_dump --data-only --schema=public --schema=private --exclude-table-data=public.excluded_fixture -d dump_fixture > /tmp/actual_data_dump.sql
          if grep -Fq "COPY public.excluded_fixture" /tmp/actual_data_dump.sql; then
            echo "pg_dump did not exclude the excluded table data."
            exit 1
          fi
          grep -F "COPY public.fixture_public" /tmp/actual_data_dump.sql
          dropdb dump_fixture
      - name: Install pgcrypto for content fingerprints
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE SCHEMA extensions; CREATE EXTENSION pgcrypto WITH SCHEMA extensions;"
      - name: Test target role bootstrap and least-privilege grants
        run: |
          psql -X -v ON_ERROR_STOP=1 -f database/transfer/tests/create_managed_roles.sql
          psql -X -v ON_ERROR_STOP=1 -f database/transfer/sql/bootstrap_target_roles.sql
          psql -X -v ON_ERROR_STOP=1 -f database/transfer/tests/runtime_role_fixtures.sql
          psql -X -v ON_ERROR_STOP=1 -f database/transfer/sql/apply_runtime_grants.sql
          psql -X -v ON_ERROR_STOP=1 -f database/transfer/tests/assert_runtime_grants.sql
      - name: Test deterministic role and default ACL inventory
        run: |
          psql -X -v ON_ERROR_STOP=1 -At -f database/transfer/sql/compare_acl_inventory.sql > /tmp/acl_inventory.txt
          grep -F '"kind": "role"' /tmp/acl_inventory.txt
          grep -F '"kind": "default_acl"' /tmp/acl_inventory.txt
          grep -F '"kind": "public_acl"' /tmp/acl_inventory.txt
      - name: Test required extension inventory
        run: |
          psql -X -v ON_ERROR_STOP=1 -At -f database/transfer/sql/compare_extensions.sql > /tmp/extensions.txt
          grep -Fx "plpgsql|1.0|pg_catalog" /tmp/extensions.txt
          grep -F "pgcrypto|" /tmp/extensions.txt
          psql -X -v ON_ERROR_STOP=1 -At -f database/transfer/sql/station_catalogue_provenance.sql > /tmp/station_catalogue_provenance.txt
          grep -Fx "orphan_coordinate_rows|0" /tmp/station_catalogue_provenance.txt
          grep -Fx "duplicate_coordinate_station_ids|0" /tmp/station_catalogue_provenance.txt
      - name: Test row counts, data fingerprints, and empty-target guards
        run: |
          psql -X -v ON_ERROR_STOP=1 -c "CREATE TABLE public.transfer_pack_fixture(id integer PRIMARY KEY); INSERT INTO public.transfer_pack_fixture VALUES (1); CREATE TABLE private.transfer_pack_fixture(id integer PRIMARY KEY); INSERT INTO private.transfer_pack_fixture VALUES (1);"
          psql -X -v ON_ERROR_STOP=1 -At -F '|' -f database/transfer/sql/compare_rowcounts.sql > /tmp/rowcounts.txt
          if grep -F "metra_observation_records" /tmp/rowcounts.txt; then
            echo "Intentionally excluded observation table must not appear in row-count equality."
            exit 1
          fi
          grep -Fx "public|transfer_pack_fixture|1" /tmp/rowcounts.txt
          grep -Fx "private|transfer_pack_fixture|1" /tmp/rowcounts.txt
          psql -X -v ON_ERROR_STOP=1 -At -F '|' -f database/transfer/sql/compare_data_hashes.sql > /tmp/data_hashes_before.txt
          grep -F "public|transfer_pack_fixture|1|" /tmp/data_hashes_before.txt
          psql -X -v ON_ERROR_STOP=1 -At -F '|' -f database/transfer/sql/compare_auth_fk_counts.sql > /tmp/auth_fk_before.txt
          grep -F "public|auth_fk_fixture|user_id|1|1|1" /tmp/auth_fk_before.txt
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE public.auth_fk_fixture SET user_id='22222222-2222-4222-8222-222222222222';"
          psql -X -v ON_ERROR_STOP=1 -At -F '|' -f database/transfer/sql/compare_data_hashes.sql > /tmp/data_hashes_after_auth_remap.txt
          if ! cmp -s /tmp/data_hashes_before.txt /tmp/data_hashes_after_auth_remap.txt; then
            echo "Auth UUID remapping unexpectedly changed non-Auth content fingerprints."
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 -At -F '|' -f database/transfer/sql/compare_auth_fk_counts.sql > /tmp/auth_fk_after.txt
          if ! cmp -s /tmp/auth_fk_before.txt /tmp/auth_fk_after.txt; then
            echo "Auth FK cardinality changed after UUID remapping."
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE public.auth_fk_fixture SET user_id='11111111-1111-4111-8111-111111111111';"
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE public.transfer_pack_fixture SET id=2;"
          psql -X -v ON_ERROR_STOP=1 -At -F '|' -f database/transfer/sql/compare_data_hashes.sql > /tmp/data_hashes_after.txt
          if cmp -s /tmp/data_hashes_before.txt /tmp/data_hashes_after.txt; then
            echo "Table content hash did not change after data mutation."
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 -c "UPDATE public.transfer_pack_fixture SET id=1;"
          psql -X -v ON_ERROR_STOP=1 -At -F '|' -f database/transfer/sql/compare_objects.sql > /tmp/objects.txt
          grep -F "table|public|transfer_pack_fixture|" /tmp/objects.txt
          grep -F "function|private|decide_metra_registration(" /tmp/objects.txt
          if psql -X -v ON_ERROR_STOP=1 -f database/transfer/sql/assert_empty_application_tables.sql; then
            echo "Expected empty-target guard to reject a populated table."
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 -c "TRUNCATE TABLE public.transfer_pack_fixture;"
          if psql -X -v ON_ERROR_STOP=1 -f database/transfer/sql/assert_empty_application_tables.sql; then
            echo "Expected private empty-target guard to reject a populated table."
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 -c "TRUNCATE TABLE private.transfer_pack_fixture;"
          psql -X -v ON_ERROR_STOP=1 -f database/transfer/sql/assert_empty_application_tables.sql
          psql -X -v ON_ERROR_STOP=1 -At -f database/transfer/sql/compare_excluded_data.sql | grep -Fx "0"
      - name: Verify export checksums reject tampering
        run: |
          mkdir -p /tmp/metra-export-check
          printf '%s\n' 'schema dump fixture' > /tmp/metra-export-check/01_schema_application.sql.gpg
          printf '%s\n' 'data dump fixture' > /tmp/metra-export-check/02_data_application.sql.gpg
          printf '%s\n' 'source_project_ref=tbdnklyxjvbrilvnwgmq' > /tmp/metra-export-check/MANIFEST.txt
          (cd /tmp/metra-export-check && sha256sum 01_schema_application.sql.gpg 02_data_application.sql.gpg MANIFEST.txt > SHA256SUMS)
          (cd /tmp/metra-export-check && sha256sum --check --strict SHA256SUMS)
          printf '%s\n' 'tampered' >> /tmp/metra-export-check/02_data_application.sql.gpg
          if (cd /tmp/metra-export-check && sha256sum --check --strict SHA256SUMS); then
            echo "Expected checksum verification to reject a tampered export."
            exit 1
          fi
      - name: Verify encrypted dump round trip
        run: |
          printf '%s\n' 'METRA transfer test' > /tmp/plain.txt
          printf '%s\n' 'ci-only-test-passphrase' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output /tmp/plain.txt.gpg /tmp/plain.txt
          printf '%s\n' 'ci-only-test-passphrase' | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --decrypt --output /tmp/roundtrip.txt /tmp/plain.txt.gpg
          cmp /tmp/plain.txt /tmp/roundtrip.txt
