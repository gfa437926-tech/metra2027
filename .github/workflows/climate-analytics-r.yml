name: Climate Analytics R

on:
  push:
    branches:
      - work/climate-analytics-r-bootstrap
    paths:
      - "services/climate-analytics-r/**"
      - ".github/workflows/climate-analytics-r.yml"
  pull_request:
    paths:
      - "services/climate-analytics-r/**"
      - ".github/workflows/climate-analytics-r.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-package-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/climate-analytics-r
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: services/climate-analytics-r
          extra-packages: any::rcmdcheck, any::climatol@4.5-0
          needs: check
      - name: Verify pinned Climatol fixture version
        run: Rscript -e 'stopifnot(as.character(packageVersion("climatol")) == "4.5.0")'
      - name: Check R package
        run: Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual"), error_on = "error")'
