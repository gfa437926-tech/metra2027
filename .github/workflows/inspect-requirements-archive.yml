name: Inspect METRA requirements archive

on:
  pull_request:
    paths:
      - "10-5-2026 برنامج ادارة البيانات الجوية مع الربط على.rar"
      - ".github/workflows/inspect-requirements-archive.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract requirements archive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar
          mkdir -p "$RUNNER_TEMP/metra-requirements"
          unar -q -o "$RUNNER_TEMP/metra-requirements" "10-5-2026 برنامج ادارة البيانات الجوية مع الربط على.rar"
          test "$(find "$RUNNER_TEMP/metra-requirements" -type f | wc -l)" -gt 0
      - name: Upload extracted requirements for review
        uses: actions/upload-artifact@v4
        with:
          name: metra-requirements-archive
          path: \${{ runner.temp }}/metra-requirements/
          if-no-files-found: error
          retention-days: 1
