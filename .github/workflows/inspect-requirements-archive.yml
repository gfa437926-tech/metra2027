name: Inspect METRA requirements archive

on:
  pull_request:
    paths:
      - "10-5-2026 برنامج ادارة البيانات الجوية مع الربط على.rar"
      - ".github/workflows/inspect-requirements-archive.yml"

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract recoverable requirements files
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq unar
          mkdir -p "$RUNNER_TEMP/metra-requirements-raw" "$RUNNER_TEMP/metra-requirements-review"
          # Some archive members are truncated; retain all recoverable files and report extraction failure separately.
          unar -q -o "$RUNNER_TEMP/metra-requirements-raw" "10-5-2026 برنامج ادارة البيانات الجوية مع الربط على.rar" || true
          count=0
          while IFS= read -r -d '' file; do
            relative="${file#"$RUNNER_TEMP/metra-requirements-raw/"}"
            case "$relative" in
              *supabase-config.js|*.env|*credential*|*secret*|*.db|*.sqlite) continue ;;
            esac
            mkdir -p "$RUNNER_TEMP/metra-requirements-review/$(dirname "$relative")"
            cp "$file" "$RUNNER_TEMP/metra-requirements-review/$relative"
            count=$((count+1))
          done < <(find "$RUNNER_TEMP/metra-requirements-raw" -type f -size +0c -print0)
          echo "Recoverable non-config source files: $count"
          test "$count" -gt 0
      - name: Upload recoverable requirements for review
        uses: actions/upload-artifact@v4
        with:
          name: metra-requirements-review
          path: ${{ runner.temp }}/metra-requirements-review/
          if-no-files-found: error
          retention-days: 1
