name: Deploy Angular app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "angular-app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular-app/package.json

      - name: Install dependencies
        working-directory: angular-app
        run: npm install

      - name: Build Angular for GitHub Pages
        working-directory: angular-app
        run: npx ng build --configuration production --base-href /metra2027/

      - name: Add SPA fallback for client-side routes
        run: cp angular-app/dist/metra2027/browser/index.html angular-app/dist/metra2027/browser/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: angular-app/dist/metra2027/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
