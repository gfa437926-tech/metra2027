name: Deploy Angular app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "angular-app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular-app/package.json

      - name: Install dependencies
        working-directory: angular-app
        run: npm install

      - name: Build Angular for GitHub Pages
        working-directory: angular-app
        run: npx ng build --configuration production --base-href /metra2027/

      - name: Validate and inject public runtime configuration
        working-directory: angular-app
        env:
          METRA_API_BASE_URL: ${{ secrets.METRA_API_BASE_URL }}
          METRA_SUPABASE_URL: ${{ secrets.METRA_SUPABASE_URL }}
          METRA_SUPABASE_ANON_KEY: ${{ secrets.METRA_SUPABASE_ANON_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'dist/metra2027/browser/metra-config.js';
          let apiBaseUrl = (process.env.METRA_API_BASE_URL || '').trim();
          while (apiBaseUrl.endsWith('/')) apiBaseUrl = apiBaseUrl.slice(0, -1);
          if (!apiBaseUrl) {
            throw new Error('METRA_API_BASE_URL is required. Configure the HTTPS API URL ending in /api/v1 in GitHub Actions secrets.');
          }
          let parsed;
          try { parsed = new URL(apiBaseUrl); } catch {
            throw new Error('METRA_API_BASE_URL must be a valid absolute URL.');
          }
          if (parsed.protocol !== 'https:' && parsed.hostname !== 'localhost' && parsed.hostname !== '127.0.0.1') {
            throw new Error('Deployed API must use HTTPS (HTTP is permitted only for localhost).');
          }
          if (parsed.username || parsed.password || parsed.search || parsed.hash) {
            throw new Error('METRA_API_BASE_URL must not contain credentials, query parameters, or fragments.');
          }
          if (!apiBaseUrl.endsWith('/api/v1')) {
            throw new Error('METRA_API_BASE_URL must end with /api/v1.');
          }
          const supabaseUrl = (process.env.METRA_SUPABASE_URL || 'https://tbdnklyxjvbrilvnwgmq.supabase.co').trim();
          const supabaseAnonKey = (process.env.METRA_SUPABASE_ANON_KEY || '').trim();
          let parsedSupabase;
          try { parsedSupabase = new URL(supabaseUrl); } catch {
            throw new Error('METRA_SUPABASE_URL must be a valid absolute URL.');
          }
          if (parsedSupabase.protocol !== 'https:' || !parsedSupabase.hostname ||
              parsedSupabase.username || parsedSupabase.password ||
              parsedSupabase.search || parsedSupabase.hash) {
            throw new Error('METRA_SUPABASE_URL must be a clean HTTPS origin without credentials, query, or fragment.');
          }
          if (!supabaseAnonKey) {
            throw new Error('METRA_SUPABASE_ANON_KEY is required; configure the public publishable/anon key as a Pages secret.');
          }
          const config = { apiBaseUrl, supabaseUrl, supabaseAnonKey };
          fs.writeFileSync(
            path,
            'window.__METRA_CONFIG__ = Object.freeze(' + JSON.stringify(config) + ');\n',
            { mode: 0o644 }
          );
          console.log('Runtime configuration validated and injected; values are not printed.');
          NODE

      - name: Add SPA fallback for client-side routes
        run: cp angular-app/dist/metra2027/browser/index.html angular-app/dist/metra2027/browser/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: angular-app/dist/metra2027/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
