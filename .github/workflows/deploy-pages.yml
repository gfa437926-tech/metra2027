name: Deploy Angular app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "angular-app/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: angular-app/package.json

      - name: Install dependencies
        working-directory: angular-app
        run: npm install

      - name: Build Angular for GitHub Pages
        working-directory: angular-app
        run: npx ng build --configuration production --base-href /metra2027/

      - name: Inject public runtime configuration
        working-directory: angular-app
        env:
          METRA_API_BASE_URL: ${{ secrets.METRA_API_BASE_URL }}
          METRA_SUPABASE_URL: ${{ secrets.METRA_SUPABASE_URL }}
          METRA_SUPABASE_ANON_KEY: ${{ secrets.METRA_SUPABASE_ANON_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'dist/metra2027/browser/metra-config.js';
          const config = {
            apiBaseUrl: process.env.METRA_API_BASE_URL || '',
            supabaseUrl: process.env.METRA_SUPABASE_URL || '',
            supabaseAnonKey: process.env.METRA_SUPABASE_ANON_KEY || ''
          };
          fs.writeFileSync(
            path,
            'window.__METRA_CONFIG__ = Object.freeze(' + JSON.stringify(config) + ');\n',
            { mode: 0o644 }
          );
          console.log('Runtime configuration injected; values are not printed.');
          NODE

      - name: Add SPA fallback for client-side routes
        run: cp angular-app/dist/metra2027/browser/index.html angular-app/dist/metra2027/browser/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: angular-app/dist/metra2027/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
