name: Backend build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/migrations/**"
      - "database/tests/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "docs/backend/**"
      - "docs/security/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/publish-api-container.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/migrations/**"
      - "database/tests/**"
      - "docs/security/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/publish-api-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-migration-test:
    name: Archive RPC migration — isolated PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metra_archive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metra_archive_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metra_archive_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Wait for isolated PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready --dbname="$DATABASE_URL"; then exit 0; fi
            sleep 2
          done
          echo "Isolated PostgreSQL did not become ready" >&2
          exit 1
      - name: Build minimal Supabase schema fixture
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file supabase/tests/fixtures/archive_schema_bootstrap.sql
      - name: Apply proposed archive migration to disposable database only
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file supabase/migrations/20261111190000_add_station_scoped_observation_archive_read_rpcs.sql
      - name: Verify RPC grants and no role auto-grants
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file supabase/tests/observation_archive_read_security.sql
      - name: Verify station isolation, expiry, revocation and client denial
        run: psql "$DATABASE_URL" --set ON_ERROR_STOP=1 --file supabase/tests/observation_archive_read_integration.sql
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore and fail on high/critical NuGet advisories
        run: dotnet restore backend/Metra.Api/Metra.Api.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=high -p:WarningsAsErrors=NU1903%3BNU1904
      - name: Verify station authorization SQL contract
        run: bash database/tests/verify_station_permission_rpc.sh
      - name: Verify authority authorization SQL contract
        run: bash database/tests/verify_authority_permission_rpc.sh
      - name: Verify authority-scoped station catalogue review contract
        run: bash database/tests/verify_authority_station_catalogue_review_contract.sh
      - name: Verify authority-scoped system registration review contract
        run: bash database/tests/verify_authority_system_registration_review_contract.sh
      - name: Verify station catalogue review authorization contract
        run: bash database/tests/verify_station_catalogue_review_contract.sh
      - name: Verify two-stage registration review contract
        run: bash database/tests/verify_registration_review_contract.sh
      - name: Verify authenticated registration submission contract
        run: bash database/tests/verify_registration_submission_contract.sh
      - name: Verify station user directory contract
        run: bash database/tests/verify_station_user_directory_contract.sh
      - name: Verify station assignment workflow contract
        run: bash database/tests/verify_station_assignment_workflow_contract.sh
      - name: Verify station audit read-model contract
        run: bash database/tests/verify_station_audit_contract.sh
      - name: Verify authority access lifecycle contract
        run: bash database/tests/verify_authority_access_lifecycle_contract.sh
      - name: Build API
        run: dotnet build backend/Metra.Api/Metra.Api.csproj --configuration Release --no-restore
      - name: Run domain and API tests
        run: dotnet test backend/Metra.Api.Tests/Metra.Api.Tests.csproj --configuration Release
      - name: Build production container image
        run: docker build --file backend/Metra.Api/Dockerfile --tag metra-api:ci .