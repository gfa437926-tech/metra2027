name: Backend build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "database/migrations/**"
      - "database/tests/**"
      - "database/isolated/**"
      - "database/baseline/**"
      - "database/proposals/**"
      - "database/seeds/**"
      - "docs/security/**"
      - "docs/delivery/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/publish-api-container.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/migrations/**"
      - "database/tests/**"
      - "database/isolated/**"
      - "database/baseline/**"
      - "database/proposals/**"
      - "database/seeds/**"
      - "docs/security/**"
      - "docs/delivery/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/publish-api-container.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore and fail on high/critical NuGet advisories
        run: dotnet restore backend/Metra.Api/Metra.Api.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=high -p:WarningsAsErrors=NU1903%3BNU1904
      - name: Verify station authorization SQL contract
        run: bash database/tests/verify_station_permission_rpc.sh
      - name: Verify authority authorization SQL contract
        run: bash database/tests/verify_authority_permission_rpc.sh
      - name: Verify authority-scoped station catalogue review contract
        run: bash database/tests/verify_authority_station_catalogue_review_contract.sh
      - name: Verify authority-scoped system registration review contract
        run: bash database/tests/verify_authority_system_registration_review_contract.sh
      - name: Verify station catalogue review authorization contract
        run: bash database/tests/verify_station_catalogue_review_contract.sh
      - name: Verify two-stage registration review contract
        run: bash database/tests/verify_registration_review_contract.sh
      - name: Verify authenticated registration submission contract
        run: bash database/tests/verify_registration_submission_contract.sh
      - name: Verify station user directory contract
        run: bash database/tests/verify_station_user_directory_contract.sh
      - name: Verify station assignment workflow contract
        run: bash database/tests/verify_station_assignment_workflow_contract.sh
      - name: Verify station audit read-model contract
        run: bash database/tests/verify_station_audit_contract.sh
      - name: Verify authority access lifecycle contract
        run: bash database/tests/verify_authority_access_lifecycle_contract.sh
      - name: Verify atomic actor-bound station read API contract
        run: bash database/tests/verify_atomic_station_read_api_contract.sh
      - name: Build API
        run: dotnet build backend/Metra.Api/Metra.Api.csproj --configuration Release --no-restore
      - name: Run domain and API tests
        run: dotnet test backend/Metra.Api.Tests/Metra.Api.Tests.csproj --configuration Release
      - name: Build production container image
        run: docker build --file backend/Metra.Api/Dockerfile --tag metra-api:ci .

  isolated-archive-authz:
    name: Isolated PostgreSQL archive authorization
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metra_test
          POSTGRES_PASSWORD: metra_test_isolated
          POSTGRES_DB: metra_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metra_test -d metra_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Apply isolated schema and run archive isolation tests
        env:
          PGPASSWORD: metra_test_isolated
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          until pg_isready -h 127.0.0.1 -U metra_test -d metra_isolated; do sleep 1; done
          psql -h 127.0.0.1 -U metra_test -d metra_isolated -v ON_ERROR_STOP=1 -f database/isolated/00_bootstrap_minimal_schema.sql
          psql -h 127.0.0.1 -U metra_test -d metra_isolated -v ON_ERROR_STOP=1 -f database/isolated/01_seed_archive_isolation_fixtures.sql
          psql -h 127.0.0.1 -U metra_test -d metra_isolated -v ON_ERROR_STOP=1 -f database/proposals/032_station_bound_archive_authorization_rpc.sql
          psql -h 127.0.0.1 -U metra_test -d metra_isolated -v ON_ERROR_STOP=1 -f database/isolated/02_test_archive_isolation.sql
          psql -h 127.0.0.1 -U metra_test -d metra_isolated -v ON_ERROR_STOP=1 -f database/isolated/03_prepare_atomic_station_reads.sql
          psql -h 127.0.0.1 -U metra_test -d metra_isolated -v ON_ERROR_STOP=1 -f database/proposals/033_atomic_actor_station_read_rpcs.sql
          psql -h 127.0.0.1 -U metra_test -d metra_isolated -v ON_ERROR_STOP=1 -f database/proposals/034_atomic_observation_write_authorization.sql
          psql -h 127.0.0.1 -U metra_test -d metra_isolated -v ON_ERROR_STOP=1 -f database/isolated/04_test_atomic_station_reads.sql
          psql -h 127.0.0.1 -U metra_test -d metra_isolated -v ON_ERROR_STOP=1 -f database/isolated/06_test_atomic_observation_writes.sql
          DATABASE_URL=postgres://metra_test:metra_test_isolated@127.0.0.1:5432/metra_isolated bash database/isolated/05_test_atomic_read_revocation_concurrency.sh

  path-n-empty-db:
    name: Path N empty PostgreSQL schema build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metra_test
          POSTGRES_PASSWORD: metra_test_isolated
          POSTGRES_DB: metra_path_n
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metra_test -d metra_path_n"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply Path N
        env:
          PATH_N_DATABASE_URL: postgres://metra_test:metra_test_isolated@127.0.0.1:5432/metra_path_n
        run: bash database/baseline/path_n_apply.sh

  grant-uniqueness-isolation:
    name: Isolated grant uniqueness (Path N + partial indexes)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metra_test
          POSTGRES_PASSWORD: metra_test_isolated
          POSTGRES_DB: metra_grants
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U metra_test -d metra_grants"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Path N then unique indexes and concurrency SQL
        env:
          PATH_N_DATABASE_URL: postgres://metra_test:metra_test_isolated@127.0.0.1:5432/metra_grants
          PGPASSWORD: metra_test_isolated
        run: |
          set -euo pipefail
          bash database/baseline/path_n_apply.sh
          psql "$PATH_N_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/proposals/c25_readiness/04_grant_unique_apply.sql
          psql "$PATH_N_DATABASE_URL" -v ON_ERROR_STOP=1 -f database/isolated/05_grant_uniqueness_concurrency.sql
