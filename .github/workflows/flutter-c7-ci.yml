# C7-only: Flutter analyze + sequential tests. No Angular, Backend, or Deploy.
name: Flutter C7 CI

on:
  push:
    branches:
      - work/backend-db-integration-phase
    paths:
      - "mobile/metra_mobile/**"
      - ".github/workflows/flutter-c7-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-c7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/metra_mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter and Dart versions
        run: |
          flutter --version
          dart --version

      - name: flutter pub get
        run: flutter pub get

      # Info-level findings (e.g. material.dart deprecation on Flutter 3.50) must not
      # block the suite; warnings/errors still fail the job.
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: flutter test --concurrency=1
        run: flutter test --concurrency=1
