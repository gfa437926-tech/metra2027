name: Publish METRA API container

on:
  push:
    branches: [main]
    paths:
      - "backend/Metra.Api/**"
      - ".github/workflows/publish-api-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: metra-api-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Audit API dependencies before publishing
        run: dotnet restore backend/Metra.Api/Metra.Api.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=high '-p:WarningsAsErrors=NU1903;NU1904'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gfa437926-tech/metra2027-api
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Metra.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
